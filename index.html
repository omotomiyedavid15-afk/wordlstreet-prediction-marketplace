<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WorldStreet Prediction Markets - High-precision probability desk, active forecasting, and binary contract settlement." />
    <meta name="theme-color" content="#0b0b0b" />
    <title>WorldStreet Prediction Markets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Handjet:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&text=%E2%82%A6"
      rel="stylesheet"
    />
    <script>
      try {
        var stored = localStorage.getItem("ws-theme");
        document.documentElement.dataset.theme =
          stored ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/prediction-app/main.tsx"></script>
  </body>
</html>
